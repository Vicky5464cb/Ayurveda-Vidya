<style>
:root{
  --bg:#f1f6f2; --surface:#ffffff; --ink:#10241c; --muted:#546a5f; --line:#d5e2d9;
  --neem:#123b2e; --turmeric:#e2a20f; --sage:#dce8df;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0b1612; --surface:#13221c; --ink:#e6efe9; --muted:#96aca0; --line:#22352c; --sage:#1b2e25;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
[data-go]{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:8px}
svg{display:block}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--neem);color:#eaf4ee}
.brand{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--turmeric);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand b{font:800 22px/1.1 var(--head);letter-spacing:.2px}
.brand small{display:block;font-size:12.5px;opacity:.75;margin-top:2px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 10px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn svg{width:22px;height:22px}
.bar .crumb{font-size:13px;opacity:.8;flex:1;text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}
:root[data-theme="dark"] .moon{display:none}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--surface);z-index:40;transform:translateX(-102%);transition:transform .28s ease;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px;display:flex;flex-direction:column;gap:6px;box-shadow:8px 0 30px rgba(0,0,0,.25)}
body.menu .drawer{transform:none}
body.menu .scrim{opacity:1;pointer-events:auto}
.drawer h2{font:700 15px var(--head);color:var(--muted);margin:10px 8px 6px}
.drawer a,.drawer button.nav{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;font-weight:500;text-align:left;width:100%}
.drawer a:hover,.drawer button.nav:hover{background:var(--sage)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* Layout */
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
.hero{padding:6px 4px 22px}
.hero h1{font:800 clamp(30px,8.5vw,44px)/1.08 var(--head);margin:0 0 10px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted);max-width:44ch}

/* Profession cards */
.prof{background:var(--c);color:var(--on);border-radius:26px;margin-bottom:16px;overflow:hidden;box-shadow:0 10px 26px -14px var(--c)}
.prof-btn{display:flex;align-items:center;gap:16px;width:100%;padding:20px 20px;text-align:left}
.ord{font:800 54px/1 var(--head);letter-spacing:-2px}
.ord sup{font-size:.42em;letter-spacing:0;vertical-align:top;position:relative;top:.25em;margin-left:2px}
.pt{flex:1;min-width:0}
.pt b{display:block;font:700 20px/1.2 var(--head)}
.pt small{display:block;opacity:.8;font-size:13.5px;margin-top:3px}
.chev{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;transition:transform .3s}
.prof.open .chev{transform:rotate(180deg)}
.chev svg{width:20px;height:20px}
.wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.prof.open .wrap{grid-template-rows:1fr}
.subs{min-height:0;overflow:hidden;list-style:none;margin:0;padding:0 18px 0 34px}
.prof.open .subs{padding-bottom:20px}
.subs ul{list-style:none;margin:0;padding:0;border-left:2px solid var(--tree);}
.subs li{position:relative;padding:4px 0 4px 22px}
.subs li::before{content:"";position:absolute;left:0;top:50%;width:18px;border-top:2px solid var(--tree)}
.subs a,.subs .sub-btn{width:100%;text-align:left;color:inherit;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;background:var(--pill);font-weight:600;transition:transform .15s,background .2s}
.subs a:hover,.subs .sub-btn:hover{background:var(--pill-h)}
.subs a:active{transform:scale(.98)}
.subs em{font-style:normal;font-weight:500;font-size:12.5px;opacity:.85}
.subs li.has-parts::before{top:27px}
.sub-btn .l{display:flex;align-items:center;gap:10px}
.sub-btn .mini{width:18px;height:18px;flex:none;transition:transform .3s}
.has-parts.open .mini{transform:rotate(180deg)}
.wrap2{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.has-parts.open .wrap2{grid-template-rows:1fr}
.wrap2>ul{min-height:0;overflow:hidden;margin-left:14px}
.has-parts.open .wrap2>ul{padding-top:8px}
.p1{--c:#1c6b4d;--on:#f2fbf6;--tree:rgba(255,255,255,.4);--pill:rgba(255,255,255,.14);--pill-h:rgba(255,255,255,.26)}
.p2{--c:#e2a20f;--on:#221800;--tree:rgba(34,24,0,.35);--pill:rgba(255,255,255,.4);--pill-h:rgba(255,255,255,.6)}
.p3{--c:#2b4a86;--on:#f1f5ff;--tree:rgba(255,255,255,.4);--pill:rgba(255,255,255,.14);--pill-h:rgba(255,255,255,.26)}

/* Subject page */
.head{background:var(--c);color:var(--on);border-radius:26px;padding:22px 22px 26px;margin-bottom:22px}
.head a.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;opacity:.9;margin-bottom:18px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--pill)}
.head a.back svg{width:18px;height:18px}
.head h1{font:800 clamp(28px,8vw,40px)/1.1 var(--head);margin:0;letter-spacing:-.4px}
.head p{margin:8px 0 0;opacity:.85;font-size:14.5px}
.parts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:22px}
.part{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:18px;padding:18px;font:700 17px var(--head);transition:transform .15s,border-color .2s}
.part:hover{border-color:var(--c)}
.part:active{transform:scale(.98)}
.part svg{width:20px;height:20px;color:var(--muted)}
.content{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.content h2{font:700 21px var(--head);margin:0 0 10px}
.content h3{font:700 17px var(--head);margin:22px 0 6px}
.content table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:9px 12px;text-align:left}
.content th{background:var(--sage)}
.chaps{display:grid;gap:10px;margin-bottom:8px}
.chap{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.chap summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;font:700 16.5px/1.3 var(--head);cursor:pointer}
.chap summary::-webkit-details-marker{display:none}
.chap summary span{flex:1}
.chap summary svg{width:20px;height:20px;color:var(--muted);transition:transform .25s;flex:none}
.chap[open] summary svg{transform:rotate(180deg)}
.chap[open]{border-color:var(--c)}
.chap-body{padding:2px 18px 18px}
.soft{color:var(--muted);margin:6px 0 0}
.empty{border:2px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 18px var(--head);margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 34px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.ord{font-size:64px}.prof-btn{padding:24px 28px}.subs{padding-left:44px;padding-right:28px}}

          "11. Medical Statistics: Introduction to Medical Statistics",
          "12. Medical Statistics: Data",
          "13. Medical Statistics: Basic Statistical Terms",
          "14. Medical Statistics: Collection & Presentation of Data",
          "15. Medical Statistics: Measures of Central Tendency",
          "16. Medical Statistics: Measures of Deviation / Dispersion / Variability",
          "17. Medical Statistics: Probability",
          "18. Medical Statistics: Hypothesis & Test of Significance",
          "19. Medical Statistics: Parametric & Non-parametric Tests",
          "20. Medical Statistics: Correlation & Regression",
          "21. Medical Statistics: Commonly Used Statistical Software"
        ]
      },
      {
        "id": "emergency-medicine",
        "name": "Emergency Medicine",
        "chapters": [
          "1. Introduction to Emergency Medicine",
          "2. Assessment & Triage",
          "3. Basic Life Support",
          "4. Advanced Life Support Principles",
          "5. Shock",
          "6. Respiratory Emergencies",
          "7. Cardiovascular Emergencies",
          "8. Neurological Emergencies",
          "9. Trauma & Injury",
          "10. Poisoning",
          "11. Burns",
          "12. Acute Abdomen",
          "13. Acute Renal/Metabolic Emergencies",
          "14. Emergency Obstetric Conditions",
          "15. Pediatric Emergencies",
          "16. Anaphylaxis",
          "17. Emergency Drugs",
          "18. CPR & Airway Management",
          "19. Disaster/Emergency Preparedness",
          "20. Referral & Stabilization"
        ]
      }
    ]
  }
];

/* Subjects with `chapters` become expandable lists of lessons on the home page */
DATA.forEach(P => P.subjects.forEach(S => {
  if (S.chapters && !S.parts) {
    S.parts = S.chapters.map((c, i) => typeof c === 'string' ? {id:'lesson-' + (i + 1), name:c} : Object.assign({id:'lesson-' + (i + 1)}, c));
    S.partLabel = 'lessons';
    delete S.chapters;
  }
}));

const $ = s => document.querySelector(s);
const app = $('#app'), crumb = $('#crumb');
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
let openId = null;
let route = '/';

document.title = SITE_NAME + ' | NCISM Study Hub';
$('#siteName').textContent = SITE_NAME;

/* ---------- Drawer ---------- */
$('#drawer').innerHTML =
  '<h2>Menu</h2><a data-go="/" tabindex="0" data-close>Home</a><h2>Professional years</h2>' +
  DATA.map(p => `<button class="nav p ${p.id}" data-open="${p.id}"><span class="dot"></span>${p.title}</button>`).join('');
const setMenu = v => document.body.classList.toggle('menu', v);
$('#menuBtn').onclick = () => setMenu(true);
$('#scrim').onclick = () => setMenu(false);
$('#drawer').addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { openId = o.dataset.open; navigate('/'); setTimeout(()=>document.getElementById(openId)?.scrollIntoView({behavior:'smooth',block:'start'}),50); }
  if (o || e.target.closest('[data-close]')) setMenu(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

/* Some in-app file previewers intercept <a> clicks as "leaving the page",
   even for same-page hash links. Stop that and route manually instead. */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (!a) return;
  e.preventDefault();
  navigate(a.dataset.go);
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const a = e.target.closest('[data-go]');
  if (!a) return;
  e.preventDefault();
  navigate(a.dataset.go);
});

/* ---------- Theme ---------- */
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
};

/* ---------- Views ---------- */
function home() {
  crumb.textContent = 'Choose a professional year';
  app.innerHTML =
    `<section class="hero"><h1>Ayurveda notes, organised by year.</h1><p>Open a professional year, then pick a subject to start studying.</p></section>` +
    DATA.map(p => `
    <article class="prof ${p.id} ${openId === p.id ? 'open' : ''}" id="${p.id}">
      <button class="prof-btn" data-prof="${p.id}" aria-expanded="${openId === p.id}">
        <span class="ord">${p.ord}<sup>${p.sup}</sup></span>
        <span class="pt"><b>Professional</b><small>${p.subjects.length} subjects: ${p.tag}</small></span>
        <span class="chev">${chev}</span>
      </button>
      <div class="wrap"><div class="subs"><ul>
        ${p.subjects.map(s => s.parts ? withParts(p, s) : `<li><a data-go="/${p.id}/${s.id}" tabindex="0">${s.name}${arrowSm()}</a></li>`).join('')}
      </ul></div></div>
    </article>`).join('');
}
function withParts(p, s) {
  return `<li class="has-parts"><button class="sub-btn" data-sub aria-expanded="false"><span class="l">${s.name}<em>${s.parts.length} ${s.partLabel || 'sub-types'}</em></span><span class="mini">${chev}</span></button>
    <div class="wrap2"><ul>${s.parts.map(pt => `<li><a data-go="/${p.id}/${s.id}/${pt.id}" tabindex="0">${pt.name}${arrowSm()}</a></li>`).join('')}</ul></div></li>`;
}
function arrowSm() { return '<span style="width:18px;height:18px;display:block">' + arrow + '</span>'; }

app.addEventListener('click', e => {
  const sb = e.target.closest('[data-sub]');
  if (sb) { const li = sb.closest('.has-parts'); sb.setAttribute('aria-expanded', li.classList.toggle('open')); return; }
  const b = e.target.closest('[data-prof]');
  if (!b) return;
  const id = b.dataset.prof;
  openId = openId === id ? null : id;
  document.querySelectorAll('.prof').forEach(el => {
    const on = el.id === openId;
    el.classList.toggle('open', on);
    el.querySelector('.prof-btn').setAttribute('aria-expanded', on);
  });
});

function placeholder(name) {
  return `<div class="empty"><b>${name} notes are coming soon</b>Study material, revision tables and practice questions will appear here.</div>`;
}

function subject(pid, sid, partId) {
  const P = DATA.find(x => x.id === pid);
  const S = P && P.subjects.find(x => x.id === sid);
  if (!S) return home();
  const Pt = partId && S.parts && S.parts.find(x => x.id === partId);
  const item = Pt || S;
  const backHref = Pt ? `/${pid}/${sid}` : '/';
  const backText = Pt ? S.name : 'All subjects';
  crumb.textContent = `${P.title} > ${item.name}`;
  openId = pid;
  const sub = Pt ? `${S.name}, ${P.title}` : P.title;
  let body;
  if (S.parts && !Pt) {
    body = `<div class="parts ${pid}">${S.parts.map(pt => `<a class="part" data-go="/${pid}/${sid}/${pt.id}" tabindex="0">${pt.name}${arrow}</a>`).join('')}</div>`;
  } else {
    const ch = (item.chapters || []).map(c => typeof c === 'string' ? {name:c} : c);
    const chaps = ch.length ? `<div class="chaps ${pid}">${ch.map(c => `<details class="chap"><summary><span>${c.name}</span>${chev}</summary><div class="chap-body">${c.content || '<p class="soft">Notes for this chapter are coming soon.</p>'}</div></details>`).join('')}</div>` : '';
    const main = item.content ? `<section class="content">${item.content}</section>` : '';
    body = (main + chaps) || `<section class="content">${placeholder(item.name)}</section>`;
  }
  app.innerHTML = `
    <div class="head ${pid}">
      <a class="back" data-go="${backHref}" tabindex="0">${back}${backText}</a>
      <h1>${item.name}</h1><p>${sub}</p>
    </div>${body}`;
}

/* ---------- Router ---------- */
function render() {
  const [p, s, part] = route.replace(/^#?\/?/, '').split('/').filter(Boolean);
  p && s ? subject(p, s, part) : home();
}
function navigate(target) {
  route = target;
  render();
  window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>
